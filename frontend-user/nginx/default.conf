server {
    listen 80;
    server_name localhost;

    # 由官方 nginx 镜像 entrypoint 的 envsubst 阶段注入（NGINX_WEBROOT=/app）
    root ${NGINX_WEBROOT};
    index index.html;

    # gzip 压缩（woff2 已预压缩，不重复处理）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # 健康检查端点：重启后行为可被编排系统稳定探测
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # 静态资源：构建产物固定在 /assets/ 下；文件名未带内容哈希，
    # 使用 must-revalidate —— 版本更新后浏览器必须重新校验，避免新旧版本混用
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # HTML 入口与版本信息始终重新校验，保证发布/重启后拿到的版本一致
    location = /version.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
