# 本机开发（docker compose dev override）与容器生产使用同一份配置，
# 保证端口、路由、缓存策略与安全行为一致。
#
# 静态文件根目录在两处结构相同：
#   生产镜像: /usr/share/nginx/html   （由构建产物 dist/ 整体拷入）
#   本机开发: /usr/share/nginx/html   （bind mount 本地构建产物 dist/）

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 只读根盘兼容：所有可写临时目录放到 tmpfs（/tmp）下
    client_body_temp_path /tmp/nginx/client-body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # 启用 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    include /etc/nginx/security-headers.conf;

    # 容器健康检查（与 compose healthcheck 对应）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # 构建期注入的版本信息（页面页脚与此处数据一致）
    location = /version.json {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # 带版本号的固化第三方资源可长期强缓存
    # ^~ 优先于下方 .css/.js 正则，确保 vendor 资源命中 immutable 策略
    location ^~ /vendor/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # 应用自有资源随版本发布，要求每次校验新鲜度
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }
}
